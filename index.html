<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#188038">
<link rel="manifest" href="manifest.webmanifest">
<script src="tema.js"></script>
<title>Cultivos · v12</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  /* Mismas variables que rural.html: al integrarlo, el módulo toma los colores de la PWA */
  :root{--green:#188038;--green-dark:#0f5c28;--green-light:#E6F4EA;--blue:#1A73E8;--blue-light:#E8F0FE;--red:#D93025;--gray:#5F6368;--gray-light:#F1F3F4;--gray-border:#DADCE0;--text:#202124;--white:#FFFFFF;--radius:8px}
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#F8F9FA;color:var(--text);font-size:15px;-webkit-font-smoothing:antialiased}
  header{background:var(--green);color:#fff;padding:12px 60px 12px 14px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.2);display:flex;align-items:center;gap:10px}
  header h1{font-size:17px;font-weight:600}header p{font-size:11.5px;opacity:.85}
  header .sp{flex:1}
  header button{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:8px;padding:7px 10px;font-size:15px;cursor:pointer}
  .container{max-width:760px;margin:0 auto;padding:12px 12px 90px}
  .card{background:var(--white);border-radius:var(--radius);border:1px solid var(--gray-border);margin-bottom:10px;overflow:hidden}
  .card-header{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--gray-light);border-bottom:1px solid var(--gray-border)}
  .card-header span{font-size:12px;font-weight:600;color:var(--gray);text-transform:uppercase;letter-spacing:.05em}
  .card-body{padding:12px}
  .pie{position:fixed;left:0;right:0;bottom:0;background:var(--white);border-top:1px solid var(--gray-border);padding:8px;display:flex;gap:6px;z-index:90}
  .pie button{flex:1;padding:12px 6px;border-radius:8px;border:1.5px solid var(--green);background:var(--white);color:var(--green);font:inherit;font-size:13.5px;font-weight:600;cursor:pointer}
  .pie button.pri{background:var(--green);color:#fff}
  .estado{font-size:11.5px;color:var(--gray);margin:0 0 8px}
  html.oscuro .pie{background:#1E2226}
</style>
</head>
<body>
<header>
  <div><h1>🌱 Cultivos del predio</h1><p id="sub">v12 · 43 cultivos · <a href="analisis_cultivos.html" style="color:#fff">Análisis ›</a></p></div>
  <div class="sp"></div>
</header>
<div class="container">
  <div class="estado" id="estado">Sin guardar todavía.</div>
  <!-- Así irá dentro de rural.html: una tarjeta más, con el mismo patrón que «Fotos de la visita» -->
  <div class="card">
    <div class="card-header"><span>🌱 Cultivos</span></div>
    <div class="card-body"><div id="cultivosContainer"></div></div>
  </div>
</div>
<div class="pie">
  <button onclick="nuevo()">Nuevo</button>
  <button onclick="importar()">Importar</button>
  <button onclick="exportar()">⬇ JSON</button>
  <button class="pri" onclick="guardar()">💾 Guardar</button>
</div>
<input type="file" id="fImp" accept=".json,application/json" style="display:none">

<script src="fotos.js"></script>
<script src="cultivos_catalogo.js"></script>
<script src="cultivos_calculos.js"></script>
<script src="cultivos_diagramas.js"></script>
<script src="cultivos_modulo.js"></script>
<script>
/* Página de PRUEBA. Guarda en este navegador (localStorage) y exporta un JSON
   con la misma forma que tendrá el registro rural: { tipo:'RURAL', id, lotes_cultivo:[…] }.
   Ese JSON es el que abre el prototipo de análisis (analisis_cultivos.html). */
const CLAVE = 'cultivos_v12_prueba';
const cultivos = crearCultivos('cultivosContainer', {
  fechaVisita: () => new Date().toISOString().slice(0, 10),
  onChange: () => guardar(true),
});
function registro() {
  let base = {};
  try { base = JSON.parse(localStorage.getItem(CLAVE) || '{}'); } catch (e) {}
  return Object.assign(base, { tipo: 'RURAL', id: base.id || ('avaluo_prueba_' + Date.now()),
    nombre_base: base.nombre_base || 'Prueba_cultivos', fecha_visita_texto: new Date().toISOString().slice(0, 10),
    lotes_cultivo: cultivos.getData(), fecha_guardado: new Date().toLocaleString('es-CO') });
}
function guardar(silencioso) {
  try { localStorage.setItem(CLAVE, JSON.stringify(registro())); document.getElementById('estado').textContent = 'Guardado en este dispositivo · ' + new Date().toLocaleTimeString('es-CO'); }
  catch (e) { document.getElementById('estado').textContent = '⚠ No se pudo guardar: ' + e.message; }
  if (!silencioso) { const r = cultivos.resumen(); alert(r.length ? r.map((x) => `${x.lote} (${x.cultivo}): ${x.completo ? 'completo' : 'falta ' + x.faltan.join(', ')}`).join('\n') : 'Sin lotes.'); }
}
function exportar() {
  const r = registro();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(r, null, 2)], { type: 'application/json' }));
  a.download = (r.nombre_base || 'cultivos') + '_Db.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1500);
}
function importar() { document.getElementById('fImp').click(); }
document.getElementById('fImp').addEventListener('change', async (e) => {
  const f = e.target.files[0]; if (!f) return;
  try { const d = JSON.parse(await f.text()); localStorage.setItem(CLAVE, JSON.stringify(d)); cultivos.setData(d.lotes_cultivo || []); guardar(true); }
  catch (err) { alert('No se pudo leer: ' + err.message); }
  e.target.value = '';
});
function nuevo() { if (confirm('¿Empezar de cero? Se borra la prueba guardada en este dispositivo.')) { localStorage.removeItem(CLAVE); cultivos.setData([]); } }
// Service worker: red primero (siempre la versión publicada si hay internet; caché solo sin señal)
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
try { const d = JSON.parse(localStorage.getItem(CLAVE) || 'null'); if (d && d.lotes_cultivo) cultivos.setData(d.lotes_cultivo); } catch (e) {}
</script>
</body>
</html>
